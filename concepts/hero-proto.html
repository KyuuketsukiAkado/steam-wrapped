<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прототип hero — «Redline-приборка»</title>
<!--
  ПРОТОТИП. Боевые index.html / style.css / app.js не задействованы.
  Цель: согласовать композицию hero (концепт C) до правок боевых файлов.

  Что в прототипе:
  - вордмарк в две строки от края до края окна, гарнитура Sofia Sans Extra Condensed 1000
  - фит строк через Range (тот же алгоритм, что пойдёт в app.js — без min(var(), vh))
  - призрачный номер 8032 под буквами
  - кирпичная диагональ через низ сцены
  - полукруглый циферблат: риски, красная зона редлайна, число часов в центре
  - тикет-pit-pass с полосатой заливкой (данные и структура — как в боевом)
  - мобильная раскладка: тикет скрыт, вордмарк в две строки, циферблат срезан снизу
-->
<style>
@font-face {
  font-family: "Sofia XCond"; font-style: normal; font-display: block;
  font-weight: 1 1000;
  src: url("../assets/fonts/sofia-sans-extra-condensed-latin-wght-normal.woff2") format("woff2-variations");
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face {
  font-family: "Sofia XCond"; font-style: normal; font-display: block;
  font-weight: 1 1000;
  src: url("../assets/fonts/sofia-sans-extra-condensed-cyrillic-wght-normal.woff2") format("woff2-variations");
  unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
}
@font-face {
  font-family: "Mono Proto"; font-style: normal; font-display: block;
  font-weight: 100 800;
  src: url("fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations");
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face {
  font-family: "Mono Proto"; font-style: normal; font-display: block;
  font-weight: 100 800;
  src: url("fonts/jetbrains-mono-cyrillic-wght-normal.woff2") format("woff2-variations");
  unicode-range: U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;
}
@font-face {
  font-family: "Golos Proto"; font-style: normal; font-display: block;
  font-weight: 100 900;
  src: url("fonts/golos-text-latin-wght-normal.woff2") format("woff2-variations");
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face {
  font-family: "Golos Proto"; font-style: normal; font-display: block;
  font-weight: 100 900;
  src: url("fonts/golos-text-cyrillic-wght-normal.woff2") format("woff2-variations");

:root {
  --bg: #0A0807;
  --bg-soft: #141110;
  --ink: #EDEDEF;
  --ink-dim: #A7A7AD;
  --ink-faint: #6E6E75;
  --c1: #BA3636;
  --c2: #9C2E28;
  --c3: #772420;
  --c4: #E07A6B;
  --line: rgba(255, 241, 231, 0.10);
  --display: "Sofia XCond", "Arial Narrow", Arial, sans-serif;
  --sans: "Golos Proto", "Segoe UI", Arial, sans-serif;
  --mono: "Mono Proto", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); }

/* ===== верх hero: фон, свечение, диагональ ===== */
.hero__red {
  position: relative; isolation: isolate; overflow-x: clip;
  padding: clamp(22px, 2.6vw, 40px) clamp(18px, 3.4vw, 56px) clamp(64px, 8vw, 120px);
  background:
    radial-gradient(72% 78% at 50% 6%, rgba(186, 54, 54, 0.42), rgba(119, 36, 32, 0.14) 52%, transparent 78%),
    #0A0807;
}
/* кирпичная диагональ через низ сцены */
.hero__red::after {
  content: ""; position: absolute; left: -2%; right: -2%; bottom: -12%; height: 38%; z-index: 0;
  background: linear-gradient(180deg, rgba(156, 46, 40, 0.92), rgba(72, 22, 19, 0.98));
  border-top: 1px solid rgba(224, 122, 107, 0.55);
  clip-path: polygon(0 46%, 100% 0, 100% 100%, 0 100%);
  pointer-events: none;
}
.hero__red > * { position: relative; z-index: 1; }
/* моно-лента технических подписей под сервисной строкой */
.hero__meta {
  display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap;
  padding: clamp(9px, 1.1vw, 14px) 0 0;
  font-family: var(--mono); font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint);
}
.hero__meta b { color: var(--ink); font-weight: 700; }
.hero__meta .sep { color: rgba(224, 122, 107, 0.6); padding: 0 8px; }

/* сервисная строка */
.hero__nav {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-bottom: clamp(12px, 1.6vw, 20px);
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; color: #FFFFFF;
  border-bottom: 1px solid rgba(186, 54, 54, 0.55);
}
.hero__nav .pill { color: rgba(255, 255, 255, 0.78); }

/* ===== сцена: вордмарк слева, приборка справа ===== */
.hero__grid {
  display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(320px, 0.98fr);
  gap: clamp(16px, 2.6vw, 52px); align-items: center;
  margin-top: clamp(14px, 2.4vw, 40px);
}
/* ===== вордмарк ===== */
.wordmark { position: relative; }
.wm {
  display: block; width: 100%; text-align: center; white-space: nowrap;
  font-family: var(--display); font-weight: 1000; text-transform: uppercase;
  line-height: 0.84; letter-spacing: -0.02em;
}
.wm--steam { color: #F2EFE9; text-shadow: 0.022em 0.022em 0 rgba(20, 14, 13, 0.9); }
.wm--wrapped { color: var(--c1); text-shadow: 0.018em 0.018em 0 rgba(24, 10, 9, 0.85); }
.wm-ghost {
  position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
  z-index: -1; margin: 0; pointer-events: none;
  font-family: var(--display); font-weight: 1000; letter-spacing: 0.01em;
  font-size: clamp(150px, 28vw, 520px); line-height: 0.8;
  color: rgba(186, 54, 54, 0.14);
  text-shadow: 0 0 90px rgba(186, 54, 54, 0.30);
}

/* ===== приборная зона: циферблат слева, тикет справа ===== */
.dash { position: relative; min-width: 0; }
.gauge { position: relative; width: 100%; max-width: 520px; margin: 0 auto; }
.gauge__svg { display: block; width: 100%; height: auto; overflow: visible; }
.gauge__tick { stroke: rgba(237, 237, 239, 0.42); stroke-width: 1.4; }
.gauge__tick--major { stroke: rgba(237, 237, 239, 0.78); stroke-width: 2.6; }
.gauge__tick--red { stroke: var(--c1); }
.gauge__tick--red.gauge__tick--major { stroke: var(--c4); }
.gauge__arc { fill: none; stroke: rgba(237, 237, 239, 0.14); stroke-width: 1.2; }
.gauge__label {
  font-family: var(--mono); font-weight: 700; font-size: 13px;
  letter-spacing: 0.06em; fill: rgba(237, 237, 239, 0.42);
}
.gauge__label--red { fill: var(--c4); }
/* прогресс-дуга: заливка от начала шкалы до текущего значения */
.gauge__progress {
  fill: none; stroke: var(--c1); stroke-width: 7; stroke-linecap: round;
  transition: stroke-dashoffset 2.2s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.gauge__knob { fill: var(--c4); }
.gauge__knob-halo { fill: rgba(224, 122, 107, 0.22); }
/* число живёт внутри дуги: центр дуги в макете — (450, 400) из 900x470 */
.gauge__readout {
  position: absolute; left: 0; right: 0; top: 57%; transform: translateY(-50%);
  text-align: center;
}
.gauge__num {
  font-family: var(--mono); font-weight: 800; font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  font-size: clamp(42px, 5.4vw, 92px); line-height: 0.94; letter-spacing: -0.045em;
  color: #F2EFE9;
}
.gauge__cap {
  margin-top: 10px; font-family: var(--mono); font-size: clamp(10px, 0.9vw, 13px);
  font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-faint);
}

/* ===== тикет-pit-pass ===== */
.ticket {
  position: absolute; right: -5%; top: 78%; z-index: 2;
  width: clamp(238px, 25%, 292px);
  padding: 0 22px 20px 32px; background: #141110;
  border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 16px;
  transform: rotate(5deg); transform-origin: 100% 100%;
  box-shadow: -16px 22px 56px rgba(0, 0, 0, 0.55), 0 0 70px rgba(186, 54, 54, 0.16);
  transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.ticket:hover { transform: rotate(1.5deg) translateY(-4px); }
.ticket::before {
  content: ""; position: absolute; top: 0; bottom: 0; left: 16px;
  border-left: 2px dashed rgba(255, 255, 255, 0.16);
}
.ticket__notch {
  position: absolute; left: 7px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--bg); border: 1px solid rgba(255, 255, 255, 0.10);
}
.ticket__notch--top { top: -10px; }
.ticket__notch--bottom { bottom: -10px; }
.ticket__head {
  margin: 14px -22px 14px -32px; padding: 9px 22px 9px 32px;
  background: var(--c1); color: #FFFFFF;
  font-family: var(--mono); font-size: 11.5px; font-weight: 800;
  letter-spacing: 0.18em; text-transform: uppercase;
}
.ticket__rows { display: grid; gap: 10px; }
.ticket__row-name {
  display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px;
  font-family: var(--mono); font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-faint);
}
.ticket__row-name b { color: var(--ink); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ticket__bar {
  height: 11px; border-radius: 2px; overflow: hidden;
  background: rgba(255, 255, 255, 0.06);
}
.ticket__bar i {
  display: block; height: 100%; width: 0; border-radius: 2px;
  background-color: var(--c1);
  background-image: repeating-linear-gradient(90deg, rgba(12, 9, 8, 0.62) 0 3px, transparent 3px 9px);
  transition: width 1s cubic-bezier(0.2, 0.7, 0.3, 1);
}
.ticket__bar--2 i { background-color: var(--c4); }
.ticket__bar--3 i { background-color: var(--c2); }
.ticket__foot {
  display: flex; justify-content: space-between; gap: 12px; margin-top: 16px;
  border-top: 1px solid rgba(255, 255, 255, 0.10); padding-top: 11px;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); letter-spacing: 0.04em;
}

/* ===== заглушка «дальше по странице» ===== */
.after {
  border-top: 1px solid var(--line); margin-top: clamp(40px, 5vw, 76px);
  padding: 16px clamp(18px, 3.4vw, 56px) 0;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; color: rgba(237, 237, 239, 0.35);
}

@media (max-width: 1080px) {
  .hero__grid { grid-template-columns: minmax(0, 1fr); gap: clamp(26px, 5vw, 44px); }
  .ticket { display: none; }
  .gauge { max-width: none; }
}
@media (max-width: 620px) {
  .hero__red { padding-bottom: clamp(44px, 11vw, 72px); }
  .hero__red::after { height: 32%; clip-path: polygon(0 60%, 100% 0, 100% 100%, 0 100%); }
  .hero__grid { margin-top: clamp(16px, 5vw, 28px); }
  /* прибор на мобилке подрезан снизу диагональю — как «механика за краем кадра» */
  .dash { margin-bottom: clamp(-46px, -9vw, -18px); }
  .gauge { max-width: min(88vw, 360px); }
  .gauge__num { font-size: clamp(40px, 13.5vw, 62px); }
  .gauge__readout { top: 52%; }
  .gauge__cap { margin-top: 7px; font-size: 10px; }
  .gauge__label { font-size: 10.5px; }
  .gauge__knob, .gauge__knob-halo { display: none; }
  .hero__meta { font-size: 9.5px; letter-spacing: 0.1em; gap: 6px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<main class="hero__red">

<script>
/* ---------- фит вордмарка: Range-замер, размер прямо в font-size ---------- */
(function wordmarkFit() {
  var lines = document.querySelectorAll("[data-wm]");
  /* Два прохода: (1) обе строки натягиваются на ширину колонки,
     (2) если суммарная высота блока не влезает в кап по высоте окна —
     обе строки пропорционально уменьшаются. Кап живёт в JS именно потому,
     что CSS min(var(), vh) ломает контрольную докрутку по Range. */
  function sizeToWidth(sp, target) {
    sp.style.fontSize = "100px";
    var size = 100;
    for (var i = 0; i < 8; i++) {
      var rng = document.createRange();
      rng.selectNodeContents(sp);
      var real = rng.getBoundingClientRect().width;
      if (!real) break;
      size = size * (target / real);
      sp.style.fontSize = size.toFixed(2) + "px";
      if (Math.abs(real - target) <= 1) break;
    }
    return size;
  }
  function fit() {
    var host = document.querySelector(".wordmark");
    if (!host) return;
    var target = host.clientWidth;
    var sizes = [];
    lines.forEach(function (sp) { sizes.push(sizeToWidth(sp, target)); });

    var cap = window.innerHeight * 0.46;
    var total = 0;
    lines.forEach(function (sp) { total += sp.getBoundingClientRect().height; });
    if (total > cap) {
      var k = cap / total;
      lines.forEach(function (sp, i) { sp.style.fontSize = (sizes[i] * k).toFixed(2) + "px"; });
    }
  }
  fit();
  window.addEventListener("resize", fit, { passive: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener("load", fit);
})();

/* ---------- прибор: риски, красная зона, стрелка ---------- */
(function gauge() {
  var NS = "http://www.w3.org/2000/svg";
  var g = document.getElementById("gaugeTicks");
  if (!g) return;
  var CX = 450, CY = 400, R_IN = 322, R_OUT = 352, R_MAJ = 366;
  var TICKS = 61;              /* 60 делений от 0 до 9 */
  var RED_FROM = 0.72;         /* доля шкалы, с которой начинается редлайн */
  var START_ANGLE = -90;       /* 0 вверху… */
  var SWEEP = 180;             /* …полукруг вниз по краям */

  function angleAt(t) { return START_ANGLE + SWEEP * t; }

  /* фоновая дуга */
  var arc = document.createElementNS(NS, "path");
  var a0 = angleAt(0) * Math.PI / 180, a1 = angleAt(1) * Math.PI / 180;
  arc.setAttribute("d", "M " + (CX + R_OUT * Math.sin(a0)) + " " + (CY - R_OUT * Math.cos(a0)) +
    " A " + R_OUT + " " + R_OUT + " 0 0 1 " + (CX + R_OUT * Math.sin(a1)) + " " + (CY - R_OUT * Math.cos(a1)));
  arc.setAttribute("class", "gauge__arc");
  g.appendChild(arc);

  for (var i = 0; i < TICKS; i++) {
    var t = i / (TICKS - 1);
    var ang = angleAt(t) * Math.PI / 180;
    var major = i % 6 === 0;
    var rOut = major ? R_MAJ : R_OUT;
    var ln = document.createElementNS(NS, "line");
    ln.setAttribute("x1", CX + R_IN * Math.sin(ang));
    ln.setAttribute("y1", CY - R_IN * Math.cos(ang));
    ln.setAttribute("x2", CX + rOut * Math.sin(ang));
    ln.setAttribute("y2", CY - rOut * Math.cos(ang));
    var cls = "gauge__tick" + (major ? " gauge__tick--major" : "");
    if (t >= RED_FROM) cls += " gauge__tick--red";
    ln.setAttribute("class", cls);
    g.appendChild(ln);

    if (major) {
      var lbl = document.createElementNS(NS, "text");
      lbl.setAttribute("class", "gauge__label" + (t >= RED_FROM ? " gauge__label--red" : ""));
      lbl.setAttribute("text-anchor", "middle");
      lbl.setAttribute("x", CX + (R_OUT + 28) * Math.sin(ang));
      lbl.setAttribute("y", CY - (R_OUT + 28) * Math.cos(ang) + 5);
      lbl.textContent = String(Math.round(t * 9));
      g.appendChild(lbl);
    }
  }

  /* прогресс-дуга: 92% шкалы — 8032 часа из 9 000 лимита */
  var VALUE = 0.92;
  var R_MID = (R_IN + R_OUT) / 2;
  var progress = document.getElementById("gaugeProgress");
  var aStart = angleAt(0) * Math.PI / 180, aEnd = angleAt(1) * Math.PI / 180;
  var half = Math.PI * R_MID;
  var d = "M " + (CX + R_MID * Math.sin(aStart)) + " " + (CY - R_MID * Math.cos(aStart)) +
          " A " + R_MID + " " + R_MID + " 0 0 1 " + (CX + R_MID * Math.sin(aEnd)) + " " + (CY - R_MID * Math.cos(aEnd));
  progress.setAttribute("d", d);
  progress.style.strokeDasharray = half;
  progress.style.strokeDashoffset = half;

  var knobAng = angleAt(VALUE) * Math.PI / 180;
  var knob = document.getElementById("gaugeKnob");
  var halo = document.getElementById("gaugeKnobHalo");
  [knob, halo].forEach(function (c) {
    c.setAttribute("cx", CX + R_MID * Math.sin(knobAng));
    c.setAttribute("cy", CY - R_MID * Math.cos(knobAng));
  });
  setTimeout(function () {
    progress.style.strokeDashoffset = (half * (1 - VALUE)).toFixed(1);
    knob.setAttribute("opacity", "1");
    halo.setAttribute("opacity", "1");
  }, 250);

  /* полосатая заливка полос тикета */
  document.querySelectorAll(".ticket__bar i").forEach(function (el) {
    var w = el.getAttribute("data-w") || "0";
    setTimeout(function () { el.style.width = w + "%"; }, 400);
  });
})();
</script>
