<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Финалисты</title>
<style>
@font-face{font-family:"F-Unbounded";font-weight:200 900;src:url("file:///home/user/steam-wrapped/assets/fonts/unbounded-latin-wght-normal.woff2") format("woff2-variations");}
@font-face{font-family:"F-Oswald";font-weight:200 700;src:url("file:///tmp/fonts2/fontsource-variable_oswald/package/files/oswald-latin-wght-normal.woff2") format("woff2-variations");}
@font-face{font-family:"F-SofiaX";font-weight:1 1000;src:url("file:///tmp/fonts2/fontsource-variable_sofia-sans-extra-condensed/package/files/sofia-sans-extra-condensed-latin-wght-normal.woff2") format("woff2-variations");}
@font-face{font-family:"F-Tektur";font-weight:400 900;src:url("file:///tmp/fonts2/fontsource-variable_tektur/package/files/tektur-latin-wght-normal.woff2") format("woff2-variations");}
@font-face{font-family:"F-Anton";font-weight:400;src:url("file:///tmp/fonts2/fontsource_anton/package/files/anton-latin-400-normal.woff2") format("woff2");}
*{box-sizing:border-box;margin:0}
body{background:#0A0807;color:#EDEDEF;font-family:Arial,sans-serif;padding:40px;width:1440px}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(186,54,54,.55);padding-bottom:13px;margin-bottom:22px}
.top b{font-family:"F-Unbounded";font-weight:900;font-size:22px}
.top span{font-family:monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(237,237,239,.5)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cell{background:radial-gradient(72% 88% at 50% 52%, rgba(186,54,54,.22), transparent 74%), #0A0807;border:1px solid rgba(255,241,231,.09);border-radius:6px;padding:20px 18px 16px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px}
.hd b{font-size:16px}
.hd em{font-style:normal;font-family:monospace;font-size:11px;color:#E07A6B}
.meta{font-family:monospace;font-size:11px;color:rgba(237,237,239,.45);margin-bottom:12px}
.stage{overflow:hidden}
.line{display:block;width:100%;text-align:center;white-space:nowrap;line-height:.88;text-transform:uppercase;letter-spacing:-.035em}
.l1{color:#EDEDEF;text-shadow:.028em .028em 0 rgba(186,54,54,.85)}
.l2{color:#BA3636;text-shadow:.028em .028em 0 rgba(119,36,32,.9)}
.badge{display:inline-block;margin-top:10px;font-family:monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(224,122,107,.5);color:#E07A6B;border-radius:3px;padding:3px 7px}
.badge.no{border-color:rgba(237,237,239,.22);color:rgba(237,237,239,.5)}
</style></head><body>
<div class="top"><b>ВОРДМАРК — 4 ФИНАЛИСТА + АНТОН</b><span>одинаковая ширина поля · реальные пропорции блоков</span></div>
<div class="grid" id="grid"></div>
<script>
var C=[
 {n:"Unbounded 900",f:"F-Unbounded",w:900,cyr:1,cur:1},
 {n:"Oswald 700",f:"F-Oswald",w:700,cyr:1},
 {n:"Sofia Sans Extra Condensed 1000",f:"F-SofiaX",w:1000,cyr:1},
 {n:"Tektur 900",f:"F-Tektur",w:900,cyr:1},
 {n:"Anton 400",f:"F-Anton",w:400,cyr:0},
 {n:"Fira Sans Condensed 900",f:"FiraCond",w:900,cyr:1,skip:1}
];
var grid=document.getElementById("grid");
C.filter(function(c){return !c.skip;}).forEach(function(c){
  var d=document.createElement("div"); d.className="cell";
  d.innerHTML='<div class="hd"><b>'+c.n+'</b>'+(c.cur?'<em>текущий</em>':'')+'</div><div class="meta" data-meta></div>'+
   '<div class="stage"><span class="line l1" data-wm>STEAM</span><span class="line l2" data-wm>WRAPPED</span></div>'+
   '<div><span class="badge'+(c.cyr?'':' no')+'">'+(c.cyr?'кириллица есть':'только латиница')+'</span></div>';
  grid.appendChild(d);
  d.querySelectorAll("[data-wm]").forEach(function(sp){sp.style.fontFamily='"'+c.f+'"';sp.style.fontWeight=c.w;});
});
function fit(){
  document.querySelectorAll(".cell").forEach(function(card){
    var stageW = card.querySelector(".stage").clientWidth, hs=[];
    card.querySelectorAll("[data-wm]").forEach(function(sp){
      var size=100; sp.style.fontSize=size+"px";
      for(var i=0;i<8;i++){
        var r=document.createRange(); r.selectNodeContents(sp);
        var w=r.getBoundingClientRect().width; if(!w) break;
        size=size*(stageW/w); sp.style.fontSize=size.toFixed(2)+"px";
        if(Math.abs(w-stageW)<=1) break;
      }
      hs.push(Math.round(sp.getBoundingClientRect().height));
    });
    card.querySelector("[data-meta]").textContent="строки "+hs[0]+" / "+hs[1]+"px · блок "+(hs[0]+hs[1])+"px при ширине "+Math.round(stageW)+"px";
  });
}
document.fonts.ready.then(fit).catch(fit);
window.addEventListener("load",function(){setTimeout(fit,300);});
</script></body></html>
